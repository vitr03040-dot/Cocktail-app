<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коктейли</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #fff; color: #000; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 10px; text-align: center; }
    button { background: #3390ec; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>🍸 Каталог коктейлей</h1>
  <div id="app">
    <div class="card">
      <h3>Апероль Шприц</h3>
      <p>⭐ 4.8</p>
      <button onclick="sendData()">Выбрать</button>
    </div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    function sendData() {
      tg.sendData(JSON.stringify({ action: 'choose', id: 1 }));
    }
  </script>
</body>
</html>0
